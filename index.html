const DF=["Oson","O‘rta","Qiyin"];

let S={club:-1,money:1000,form:"3-1-2",diff:1,squad:[{name:"T.Fazzilddin",p:"F",r:68},{name:"S.Mag'rurbek",p:"F",r:66},{name:"S.Kamronbek",p:"M",r:67},{name:"B.Javohir",p:"D",r:65},{name:"Amirxan",p:"D",r:64},{name:"B.Ruslon",p:"D",r:64},{name:"T.Shahzodbek",p:"G",r:66}]};

const bd=i=>`<i class="bd" style="background:linear-gradient(90deg,${CL[i][1]} 50%,${CL[i][2]} 50%)"></i>`;
const topBar=t=>`<div class="top"><button class="bk" onclick="go('menu')">‹</button><h2>${t}</h2><b class="mn">💰 ${S.money}</b></div>`;

function ask(t,fn){const d=$("dlg");d.innerHTML=`<div>${t}</div><div><button class="btn" style="width:140px;display:inline-block" id="dy">Ha</button><button class="btn" style="width:140px;display:inline-block" id="dn">Yo‘q</button></div>`;d.style.display="flex";$("dn").onclick=()=>d.style.display="none";$("dy").onclick=()=>{d.style.display="none";fn()}}

window.onerror=(m,u,l)=>{const e=$("err");e.style.display="block";e.textContent="Xato: "+m+" ("+l+")"};
document.addEventListener("touchmove",e=>{if(G)e.preventDefault()},{passive:false});
// ---------- Menyu ekranlari
const R={
clubs(){$("clubs").innerHTML=`<h2 class="tt">Klubingizni tanlang</h2><div class="grid">${CL.map((c,i)=>`<div class="cc" onclick="pick(${i})">${bd(i)}<b>${c[0]}</b></div>`).join("")}</div>`},
menu(){$("menu").innerHTML=`<div class="hero">${bd(S.club)}<div><b>${CL[S.club][0]}</b><small>💰 ${S.money}</small></div></div>
<button class="btn big" onclick="startMatch()">⚽ Play</button><button class="btn" onclick="go('tactic')">📋 Taktika sxema</button><button class="btn" onclick="go('squad')">👥 Oyinchilarim</button><button class="btn" onclick="go('shop')">🛒 Oyinchi sotib olish</button><button class="btn" onclick="go('settings')">⚙️ Sozlamalar</button>`},

<div class="mp">${L.map(s=>`<div class="dt" style="left:${s.ax*96+2}%;top:${s.ay*100}%"><i style="background:${s.role=="G"?"#ff7043":CL[S.club][1]}"></i>${s.p.name}</div>`).join("")}</div>
${L.map(s=>`<div class="row"><span class="pos">${s.role}</span><div class="nm"><b>${s.p.name}</b><small>${PN[s.role]}</small></div><span class="rt">${s.p.r}</span></div>`).join("")}`},
squad(){const L=lineup(S.squad,S.form).map(s=>s.p);$("squad").innerHTML=topBar("Oyinchilarim")+`<p style="color:#aab;font-size:13px;margin-bottom:6px">Bosing — o‘yinchi o‘z o‘rnida asosga chiqadi</p>`+S.squad.map((p,i)=>`<div class="row" onclick="prio(${i})"><span class="pos">${p.p}</span><div class="nm"><b>${p.name}</b><small>${PN[p.p]}</small></div><span class="rt">${p.r}</span><span class="tag ${L.includes(p)?"":"z"}">${L.includes(p)?"Asosiy":"Zaxira"}</span></div>`).join("")},
shop(){$("shop").innerHTML=topBar("Oyinchi sotib olish")+SHOP.map((s,i)=>{const own=S.squad.some(p=>p.name==s[0]);return`<div class="row"><span class="pos">${s[1]}</span><div class="nm"><b>${s[0]}</b><small>${PN[s[1]]}</small></div><span class="rt">${s[2]}</span>${own?'<span class="tag">Sizda</span>':`<button class="pr" onclick="buy(${i})" ${S.money<s[3]?"disabled":""}>💰 ${s[3]}</button>`}</div>`}).join("")},
settings(){$("settings").innerHTML=topBar("Sozlamalar")+`<div class="row" style="flex-direction:column"><b>🎁 Promokod</b><input id="pc" placeholder="Kod"><button class="btn" style="width:200px" onclick="promo()">Qo‘llash</button><small id="pm"></small></div>
<div class="row" style="flex-direction:column"><b>Qiyinlik</b><div class="chips">${DF.map((d,i)=>`<div class="chip ${i==S.diff?"on":""}" onclick="S.diff=${i};save();R.settings()">${d}</div>`).join("")}</div></div>
<button class="btn" onclick="go('clubs')">🔄 Klubni o‘zgartirish</button><button class="btn" onclick="ask('Hammasi o‘chadi. Rozimisiz?',resetAll)">🗑 Boshidan boshlash</button>`}};
function pick(i){S.club=i;save();go("menu")}
function setF(f){S.form=f;save();R.tactic()}
function prio(i){const p=S.squad.splice(i,1)[0];S.squad.unshift(p);save();R.squad()}
function buy(i){const s=SHOP[i];if(S.money<s[3])return;S.money-=s[3];S.squad.unshift({name:s[0],p:s[1],r:s[2]});save();R.shop();document.querySelector("#shop .mn").textContent="💰 "+S.money}
function promo(){const v=$("pc").value.trim().toUpperCase();if(v=="B.J"){S.money+=99999;save();$("pm").textContent="✅ +99999 pul qo‘shildi!";document.querySelector("#settings .mn").textContent="💰 "+S.money}else $("pm").textContent="❌ Kod noto‘g‘ri"}
function lineup(sq,f){const[d,m,a]=f.split("-").map(Number),need={G:1,D:d,M:m,F:a},pk={},used=new Set,out=[];
for(const r of"GDMF"){pk[r]=sq.filter(p=>p.p==r).slice(0,need[r]);pk[r].forEach(p=>used.add(p))}
const rest=sq.filter(p=>!used.has(p)&&p.p!="G").sort((x,y)=>y.r-x.r);
for(const r of"GDMF"){while(pk[r].length<need[r])pk[r].push(rest.shift());const X={G:.04,D:.22,M:.5,F:.76}[r],n=need[r];pk[r].forEach((p,i)=>out.push({p,role:r,ax:X,ay:(i+1)/(n+1)}))}
return out}
// ---------- O'yin
const W=1000,H=600,GY=[225,375],cv=$("cv"),cx=cv.getContext("2d");
let G=null,keys={},joy={x:0,y:0},aH=false,bP=false,ac;
function beep(f=300,l=.08){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+l)}catch(e){}}
var rw=0,rh=0;function resize(){const d=Math.min(devicePixelRatio||1,2),w=cv.clientWidth||innerWidth,h=cv.clientHeight||innerHeight;rw=w;rh=h;cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,300));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function mkTeam(side,lu,c1,c2,names,rr){return lu.map((s,i)=>{const r=names?rr:s.p.r,ax=side?1-s.ax:s.ax;return{side,role:s.role,name:names?names[i]:s.p.name,r,hx:ax*W,hy:s.ay*H,x:ax*W,y:s.ay*H,fx:side?-1:1,fy:0,cool:0,tk:0,wk:0,hold:0,num:i+1,c1:s.role=="G"?(side?"#c0ca33":"#ff7043"):c1,c2,hair:HAIR[Math.random()*6|0],sp:(1.6+r*.017)*(side?.97:1)}})}
function startMatch(){let o;do o=Math.random()*CL.length|0;while(o==S.club);
const mc=CL[S.club],oc=CL[o],ok=oc[1]==mc[1]?oc[2]:oc[1],nm=[...ONAMES].sort(()=>Math.random()-.5).slice(0,7),fo=FORMS[Math.random()*FORMS.length|0];
const a=mkTeam(0,lineup(S.squad,S.form),mc[1],mc[2]),b=mkTeam(1,lineup(S.squad.map(p=>({...p,r:0})),fo),ok,oc[2],nm,60+S.diff*5);
G={P:[...a,...b],b:{x:W/2,y:H/2,vx:0,vy:0,o:null},sc:[0,0],t:150,pause:0,ctrl:null,chase:[],over:false,o:o};
$("b1").innerHTML=bd(S.club);$("b2").innerHTML=bd(o);$("n1").textContent=mc[0];$("n2").textContent=oc[0];$("ov").style.display="none";$("msg").style.display="none";
go("game");resize();kickoff(0);last=performance.now();requestAnimationFrame(loop)}
function take(p){const g=G;g.b.o=p;g.b.vx=g.b.vy=0;p.hold=0;if(p.side==0)g.ctrl=p.role=="G"?null:p}
function kickoff(side){const g=G,b=g.b;g.P.forEach(p=>{p.x=p.hx;p.y=p.hy;p.cool=p.tk=0;p.fx=p.side?-1:1;p.fy=0});b.x=W/2;b.y=H/2;b.vx=b.vy=0;b.o=null;g.pause=0;$("msg").style.display="none";
const f=g.P.find(p=>p.side==side&&p.role=="F");f.x=W/2+(side?20:-20);f.y=H/2;take(f)}
function goal(s){const g=G;g.sc[s]++;g.pause=110;g.conc=1-s;g.b.o=null;const m=$("msg");m.textContent="⚽ GOL!";m.style.display="block";m.style.animation="none";m.offsetWidth;m.style.animation="";beep(700,.4)}
function shoot(p){const g=G,b=g.b,gx=p.side?0:W,ty=H/2+(Math.random()-.5)*(GY[1]-GY[0]-30),dx=gx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy),an=Math.atan2(dy,dx)+(Math.random()-.5)*(d/700)*(p.side?.5:.3),v=9+p.r*.09+Math.min(d,500)*.005;
b.o=null;b.vx=Math.cos(an)*v;b.vy=Math.sin(an)*v;b.x=p.x+Math.cos(an)*18;b.y=p.y+Math.sin(an)*18;p.cool=25;beep(220,.12)}
function pass(p,ix,iy){const g=G,b=g.b;let best=null,bs=-1e9;
for(const q of g.P){if(q===p||q.side!=p.side)continue;const dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1;let s=(ix||iy)?(dx*ix+dy*iy)/d*300-d*.25:dx*(p.side?-1:1)*.8-d*.3;if(q.role=="G")s-=500;if(d<50)s-=400;if(s>bs){bs=s;best=q}}
if(!best)return;const dx=best.x+best.fx*15-p.x,dy=best.y+best.fy*15-p.y,d=Math.hypot(dx,dy)||1,v=Math.max(5,Math.min(15,d/40));
b.o=null;b.vx=dx/d*v;b.vy=dy/d*v;b.x=p.x+dx/d*18;b.y=p.y+dy/d*18;p.cool=20;if(p.side==0&&p.role!="G")g.ctrl=best;beep(500)}
function mv(p,tx,ty,k,dt){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d<2)return;const s=Math.min(d,p.sp*k*dt*(G.b.o===p?.92:1)),ux=dx/d,uy=dy/d;p.x=Math.max(0,Math.min(W,p.x+ux*s));p.y=Math.max(10,Math.min(H,p.y+uy*s));p.fx+=(ux-p.fx)*.35;p.fy+=(uy-p.fy)*.35;p.wk+=s*.45}
function ai(p,dt){const g=G,b=g.b,sd=p.side,dir=sd?-1:1,gx=sd?0:W;
if(p.role=="G"){const gl=sd?W-30:30,ty=Math.max(H/2-65,Math.min(H/2+65,b.y));
if(b.o===p){p.hold++;mv(p,gl+dir*40,H/2,.6,dt);if(p.hold>45)pass(p,0,0);return}
const bx=Math.abs(b.x-gl);if(!b.o&&bx<170&&Math.abs(b.y-H/2)<130&&Math.hypot(b.vx,b.vy)<5){mv(p,b.x,b.y,.9,dt);return}
mv(p,gl+dir*Math.min(30,bx*.12),ty,.7,dt);return}
if(b.o===p){p.hold++;const dd=Math.abs(p.x-gx);let nr=null,nd=1e9;for(const q of g.P)if(q.side!=sd){const d=dist(p,q);if(d<nd){nd=d;nr=q}}
